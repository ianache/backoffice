x-microui-defaults: &microui-defaults
  networks: [backoffice]
  restart: unless-stopped

services:
  # --- Local Keycloak (optional) ---------------------------------------------
  # Not required for the app: bff/portal authenticate against the remote QA
  # Keycloak (oauth2.qa.comsatel.com.pe) by default. Start this only if you need
  # a local realm to poke at: `docker compose --profile local-keycloak up`
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [backoffice]
    profiles: ["local-keycloak"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backoffice]
    profiles: ["local-keycloak"]

  # --- Core stack --------------------------------------------------------------
  mysql:
    image: mysql:5.6
    platform: linux/amd64   # Required for ARM Macs; harmless on x86_64
    environment:
      MYSQL_DATABASE: backoffice
      MYSQL_USER: backoffice
      MYSQL_PASSWORD: backoffice
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backoffice]

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: mysql+asyncmy://backoffice:backoffice@mysql:3306/backoffice
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret-change-in-prod}
      DEBUG: "false"
      KEYCLOAK_URL: ${KEYCLOAK_URL:-https://oauth2.qa.comsatel.com.pe}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-Apps}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-backoffice-backend}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?set KEYCLOAK_ADMIN_CLIENT_SECRET in .env}
      SDK_SECRET_KEY: ${SDK_SECRET_KEY:-dev-sdk-secret-change-in-prod}
      BFF_INTERNAL_URL: http://bff:3000
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backoffice]
    restart: unless-stopped

  bff:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        APP_DIR: bff
        START_CMD: node dist/index.js
    environment:
      PORT: 3000
      KEYCLOAK_URL: ${KEYCLOAK_URL:-https://oauth2.qa.comsatel.com.pe}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-Apps}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-backoffice-bff}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set KEYCLOAK_CLIENT_SECRET in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      NODE_ENV: production
      BACKEND_URL: http://backend:8000
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret-change-in-prod}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-backoffice-admin-svc}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?set KEYCLOAK_ADMIN_CLIENT_SECRET in .env}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks: [backoffice]
    restart: unless-stopped

  portal:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        APP_DIR: portal
        START_CMD: node_modules/.bin/vite preview --host 0.0.0.0
        VITE_KEYCLOAK_URL: ${KEYCLOAK_URL:-https://oauth2.qa.comsatel.com.pe}
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-Apps}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-backoffice-portal}
        VITE_BFF_URL: http://localhost:3000
        VITE_BO_TENANT_ID: ${VITE_BO_TENANT_ID:-2}
        VITE_BO_SDK_KEY: ${SDK_SECRET_KEY:-dev-sdk-secret-change-in-prod}
        VITE_REMOTE_SECURITY: http://localhost:5174
        VITE_REMOTE_TENANTS: http://localhost:5176
        VITE_REMOTE_FEATURE_FLAGS: http://localhost:5178
        VITE_REMOTE_LABELING: http://localhost:5179
    environment:
      VITE_KEYCLOAK_URL: ${KEYCLOAK_URL:-https://oauth2.qa.comsatel.com.pe}
      VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-Apps}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-backoffice-portal}
      VITE_BFF_URL: http://localhost:3000
      VITE_BO_TENANT_ID: ${VITE_BO_TENANT_ID:-2}
      VITE_BO_SDK_KEY: ${SDK_SECRET_KEY:-dev-sdk-secret-change-in-prod}
      VITE_REMOTE_SECURITY: http://localhost:5174
      VITE_REMOTE_TENANTS: http://localhost:5176
      VITE_REMOTE_FEATURE_FLAGS: http://localhost:5178
      VITE_REMOTE_LABELING: http://localhost:5179
    ports:
      - "5173:5173"
    depends_on:
      - bff
    networks: [backoffice]
    restart: unless-stopped

  # --- Micro-UIs (Module Federation remotes) -----------------------------------
  mui-security:
    <<: *microui-defaults
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        APP_DIR: microuis/mui-security
        START_CMD: node_modules/.bin/vite preview --host 0.0.0.0
    ports:
      - "5174:5174"

  mui-tenants:
    <<: *microui-defaults
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        APP_DIR: microuis/mui-tenants
        START_CMD: node_modules/.bin/vite preview --host 0.0.0.0
    ports:
      - "5176:5176"

  mui-feature-flags:
    <<: *microui-defaults
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        APP_DIR: microuis/mui-feature-flags
        START_CMD: node_modules/.bin/vite preview --host 0.0.0.0
    ports:
      - "5178:5178"

  mui-labeling:
    <<: *microui-defaults
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        APP_DIR: microuis/mui-labeling
        START_CMD: node_modules/.bin/vite preview --host 0.0.0.0
    ports:
      - "5179:5179"

  mui-observability:
    <<: *microui-defaults
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        APP_DIR: microuis/mui-observability
        START_CMD: node_modules/.bin/vite preview --host 0.0.0.0
    ports:
      - "5180:5180"

networks:
  backoffice:
    driver: bridge

volumes:
  postgres_data:
  mysql_data:
